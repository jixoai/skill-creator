<!doctype html>
<!--
  Orthogonal intents (maintained 2026-09-15; original user request: 新增 www/
  产品官网，jixoai 家族风格，英文单语言站点):
  1. No-flash theme bootstrap before first paint: read localStorage `theme`
     (light|dark|system), set the `.dark` class + colorScheme on <html>.
  2. JS liveness flag (`html.js`): reveal/card-grid entrance hidden states
     key on it, so prerendered and no-JS output stays fully visible.
  3. favicon + theme-color + share cards: theme-color is media-split
     (light #ffffff / dark #000000 — the dark canvas is the family law,
     OS-light visitors get matching chrome); the favicon set is the
     brand Monochrome Mini recolored to the documented brand primary
     (oklch 0.841 0.238 128.85 → #5fa600, resources/README.md law);
     og/twitter cards carry the generated og-image.png.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- theme-color follows the OS scheme by default (the dark canvas is the
         family law; OS-light visitors get a white browser chrome instead of a
         black band over a light page). A localStorage theme override cannot
         reach meta tags without JS — the media split covers the system
         default, which is also the first-paint default below. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="48x48" href="%sveltekit.assets%/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <script>
      (() => {
        // No-flash theme bootstrap + JS liveness flag (reveal/card-grid
        // styles key off html.js so prerendered and no-JS output stays
        // fully visible).
        const root = document.documentElement;
        root.classList.add("js");
        const isTheme = (value) => value === "light" || value === "dark" || value === "system";
        let theme = "system";
        try {
          const stored = window.localStorage.getItem("theme");
          if (isTheme(stored)) theme = stored;
        } catch {
          theme = "system";
        }
        const prefersDark =
          typeof window.matchMedia === "function" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        root.classList.toggle("dark", theme === "dark" || (theme === "system" && prefersDark));
        root.style.colorScheme = root.classList.contains("dark") ? "dark" : "light";
      })();
    </script>
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
